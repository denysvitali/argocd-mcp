# golangci-lint v2 configuration. The v1 schema (no `version` key,
# `linters-settings`, gofmt under `linters`) is rejected outright by v2.
version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
  settings:
    staticcheck:
      # SA1019 is handled by //lint:ignore directives for CI's staticcheck.
      checks: ["all", "-SA1019"]

formatters:
  enable:
    - gofmt
